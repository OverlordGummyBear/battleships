<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BattleShip</title>
</head>
<body>
    <h1>Battleship</h1>
    
    <div id="gameprep">
        <select id="ships-to-place"> </select>
        <div>
            <input type="checkbox" id="horizontal" name="horizontal">
            <label id="horizontal-label" for="horizontal">Horizontal</label>
        </div>

        <button id="random-ship-placement"> Place fleet randomly</button>
    </div>
    <button id="reset-button"> Reset </button>

    <h2 class="finish-message"> </h2>
    <div class="player-boards-container"> 
        <div>
            <h2>Player 1</h2>
            <div id="p1-board" class="board-container">

            </div>
        </div>

        <div>
            <h2>Player 2 (PC)</h2>
            <div id="p2-board" class="board-container">

            </div>
        </div>
    </div>

</body>
</html>
